    // 東京標準發音核心播放器
    function playTokyoNativeAudio(textToSpeak) {
      const primaryUrl = `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=ja&q=${encodeURIComponent(textToSpeak)}`;
      const audio = new Audio(primaryUrl);

      audio.play().catch(() => {
        const secondaryUrl = `https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(textToSpeak)}&le=jap`;
        const audio2 = new Audio(secondaryUrl);

        audio2.play().catch(() => {
          if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(textToSpeak + "。");
            u.lang = 'ja-JP';
            u.rate = 1.0;
            u.pitch = 1.0;
            const voices = window.speechSynthesis.getVoices();
            const jpVoice = voices.find(v => v.lang.startsWith('ja') && (v.name.includes('Google') || v.name.includes('Kyoko') || v.name.includes('Natural') || v.name.includes('Otoya')));
            if (jpVoice) u.voice = jpVoice;
            window.speechSynthesis.speak(u);
          }
        });
      });
    }

    function shuffle(arr) {
      return [...arr].sort(() => Math.random() - 0.5);

        bar.style.display = 'none';

      if (currentMode === 'youon_quiz') {
        quizAnswered = false;
        let pool = activeYouonList.filter(item => item.kana !== lastTarget);
        if (pool.length === 0) pool = activeYouonList;
        currentItem = pool[Math.floor(Math.random() * pool.length)];
        lastTarget = currentItem.kana;

        const options = shuffle([currentItem.kana, ...currentItem.traps]);

        container.innerHTML = `
          <div style="font-size:14px; font-weight:bold; color:#64748b;">【拗音聽力測驗】請選出聽到的拗音：</div>

          <button class="audio-btn" onclick="playTokyoNativeAudio('${currentItem.kana}')">
            🔊 播放發音
          </button>

          <div class="grid-4">
            ${options.map(opt => `<button class="opt-btn" onclick="judgeYouonQuiz('${opt}')" id="y_${opt}">${opt}</button>`).join('')}
          </div>

          <div class="feedback" id="quizFeedback">點選按鈕作答</div>

          <div class="ctrl-row">
            <button class="btn-action btn-primary" onclick="nextRound()">換下一題 ➔</button>
          </div>
        `;
        status.innerText = `測驗範圍：${activeYouonList.length} 音 ｜ 成績：${score.correct} / ${score.total}`;
        setTimeout(() => playTokyoNativeAudio(currentItem.kana), 250);

      // 2. 33 拗音大字卡
      } else if (currentMode === 'youon_card') {
        currentItem = activeYouonList[youonCardIndex];
        container.innerHTML = `
          <div style="font-size:14px; font-weight:bold; color:#64748b;">全套 33 拗音大字卡</div>

          <div class="big-youon">${currentItem.kana}</div>
          <div class="romaji-tag">${currentItem.romaji}</div>

          <button class="audio-btn" onclick="playTokyoNativeAudio('${currentItem.kana}')">
            🔊 發音
          </button>

          <div class="ctrl-row">
            <button class="btn-action" onclick="prevYouonCard()">上一張</button>
            <button class="btn-action" onclick="randomYouonCard()">隨機抽</button>
            <button class="btn-action btn-primary" onclick="nextYouonCard()">下一張</button>
          </div>
        `;
        status.innerText = `進度：第 ${youonCardIndex + 1} / ${activeYouonList.length} 音`;

      // 3. 長音聽力辨析（短音 vs 長音）
      } else if (currentMode === 'choon') {
        quizAnswered = false;
        choonIndex = Math.floor(Math.random() * choonDatabase.length);
        currentChoonItem = choonDatabase[choonIndex];
        choonTargetKey = Math.random() < 0.5 ? 'short' : 'long';
        const targetObj = currentChoonItem[choonTargetKey];

        container.innerHTML = `
          <div style="font-size:14px; font-weight:bold; color:#64748b;">【長短音辨析】聽聽看是「短音」還是「長音」？</div>

          <button class="audio-btn" onclick="playTokyoNativeAudio('${targetObj.audio}')">
            🔊 播放辨析發音
          </button>

          <div class="grid-choon">
            <button class="opt-btn-choon" id="choon_short" onclick="judgeChoon('short')">
              <div class="choon-kana">${currentChoonItem.short.kana}</div>
              <div class="choon-desc">${currentChoonItem.short.romaji} ｜ ${currentChoonItem.short.mean}</div>
            </button>
            <button class="opt-btn-choon" id="choon_long" onclick="judgeChoon('long')">
              <div class="choon-kana">${currentChoonItem.long.kana}</div>
              <div class="choon-desc">${currentChoonItem.long.romaji} ｜ ${currentChoonItem.long.mean}</div>
            </button>
          </div>

          <div class="feedback" id="quizFeedback">仔細聆聽發音長度後作答</div>

          <div class="ctrl-row">
            <button class="btn-action btn-primary" onclick="nextRound()">換下一題 ➔</button>
          </div>
        `;
        status.innerText = `長短音題庫：${choonDatabase.length} 組經典對照 ｜ 成績：${score.correct} / ${score.total}`;
        setTimeout(() => playTokyoNativeAudio(targetObj.audio), 250);

      // 4. 生活單字練習（拗音・長音）
      } else if (currentMode === 'words') {
        const w = wordsDatabase[wordIndex];
        container.innerHTML = `
          <span class="word-tag">${w.tag}</span>

          <div class="word-img-box">${w.img}</div>
          <div class="word-kana-display">${w.kana}</div>
          <div class="word-romaji-display">${w.romaji}</div>
          <div class="word-meaning-display">${w.meaning}</div>

          <button class="audio-btn" onclick="playTokyoNativeAudio('${w.audio}')">
            🔊 發音
          </button>

          <div class="ctrl-row">
            <button class="btn-action" onclick="prevWord()">上一個</button>
            <button class="btn-action btn-primary" onclick="nextWord()">下一個</button>
          </div>
        `;
        status.innerText = `進度：第 ${wordIndex + 1} / ${wordsDatabase.length} 個（拗音與長音專題）`;
      }
    }

    // 拗音測驗判斷
    function judgeYouonQuiz(choice) {
      if (quizAnswered) return;
      quizAnswered = true;
      score.total++;
      const fb = document.getElementById("quizFeedback");
      if (choice === currentItem.kana) {
        score.correct++;
        document.getElementById(`y_${choice}`).classList.add("correct");
        fb.innerHTML = `<span style="color:#16a34a;">✅ 答對了！【${currentItem.kana}】（${currentItem.romaji}）</span>`;
      } else {
        document.getElementById(`y_${choice}`).classList.add("wrong");
        document.getElementById(`y_${currentItem.kana}`).classList.add("correct");
        fb.innerHTML = `<span style="color:#dc2626;">❌ 答錯了！正確答案是【${currentItem.kana}】（${currentItem.romaji}）</span>`;
      }
      document.getElementById("statusBar").innerText = `測驗範圍：${activeYouonList.length} 音 ｜ 成績：${score.correct} / ${score.total}`;
    }

    // 長音對比測驗判斷
    function judgeChoon(choice) {
      if (quizAnswered) return;
      quizAnswered = true;
      score.total++;
      const fb = document.getElementById("quizFeedback");
      const targetObj = currentChoonItem[choonTargetKey];

      if (choice === choonTargetKey) {
        score.correct++;
        document.getElementById(`choon_${choice}`).classList.add("correct");
        fb.innerHTML = `<span style="color:#16a34a;">✅ 聽力正確！答案是【${targetObj.kana}】(${targetObj.mean})</span>`;
      } else {
        document.getElementById(`choon_${choice}`).classList.add("wrong");
        document.getElementById(`choon_${choonTargetKey}`).classList.add("correct");
        fb.innerHTML = `<span style="color:#dc2626;">❌ 聽錯囉！正確發音是【${targetObj.kana}】(${targetObj.mean})</span>`;
      }
      document.getElementById("statusBar").innerText = `長短音題庫：${choonDatabase.length} 組經典對照 ｜ 成績：${score.correct} / ${score.total}`;
    }

    // 拗音字卡翻頁
    function nextYouonCard() { youonCardIndex = (youonCardIndex + 1) % activeYouonList.length; nextRound(); }
    function prevYouonCard() { youonCardIndex = (youonCardIndex - 1 + activeYouonList.length) % activeYouonList.length; nextRound(); }
    function randomYouonCard() { youonCardIndex = Math.floor(Math.random() * activeYouonList.length); nextRound(); }

    // 單字翻頁
    function nextWord() { wordIndex = (wordIndex + 1) % wordsDatabase.length; nextRound(); }
    function prevWord() { wordIndex = (wordIndex - 1 + wordsDatabase.length) % wordsDatabase.length; nextRound(); }

    // 初始化啟動
    renderFilters();
    nextRound();
  </script>
</body>
</html>
